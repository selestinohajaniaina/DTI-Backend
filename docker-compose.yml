name: dti

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-dti}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    # Localhost only: reachable from database tools on this machine,
    # never exposed to the network.
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dti} -d ${POSTGRES_DB:-dti}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Explicit allow-list: only these variables enter the container.
    # Compose interpolates ${...} from the shell or the .env file.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      DATABASE_URL: postgres://${POSTGRES_USER:-dti}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@db:5432/${POSTGRES_DB:-dti}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
    name: dti_pgdata
